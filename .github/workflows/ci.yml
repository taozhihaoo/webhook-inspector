name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhook_inspector_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_API_TOKEN: ci-placeholder-token
      SECRET_KEY: ci-placeholder-secret
      DATABASE_URL: postgresql+asyncpg://webhook:webhook@localhost:5432/webhook_inspector_ci
      TEST_DATABASE_URL: postgresql+asyncpg://webhook:webhook@localhost:5432/webhook_inspector_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Apply migrations (PostgreSQL)
        run: alembic upgrade head
      - name: Run tests (against PostgreSQL)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck & production build
        run: npm run build
