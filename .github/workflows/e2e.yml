name: E2E

# End-to-end tests run the full docker compose stack (with the demo override
# so replay can target the built-in mock receiver) and drive the real UI.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: >
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
        env:
          ADMIN_API_TOKEN: e2e-admin-token
          SECRET_KEY: e2e-secret-key-for-ci
          POSTGRES_PASSWORD: webhook

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; docker compose logs --tail 100; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_ADMIN_TOKEN: e2e-admin-token

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
