name: E2E

# End-to-end tests run the full docker compose stack (with the demo override
# so replay can target the built-in mock receiver) and drive the real UI.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure stack environment
        run: |
          cat > .env <<'EOF'
          ADMIN_API_TOKEN=ci-e2e-4f9a1c7e2b8d46309a5d1f7c3e6b0a24
          SECRET_KEY=ci-e2e-8d2b5f1a9e4c7306b5d8a2f1c4e7903b
          POSTGRES_PASSWORD=webhook
          BASE_URL=http://localhost:8000
          EOF

      - name: Build and start the stack
        run: >
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; docker compose logs --tail 100; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_ADMIN_TOKEN: ci-e2e-4f9a1c7e2b8d46309a5d1f7c3e6b0a24

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
